<style>
:root{--bg:#F6EEDC;--card:#FFFFFF;--ink:#2A1B17;--muted:#6B5A52;--line:#E8DAC0;--red:#A8102B;--redink:#FFFFFF;--gold:#F2B011;--green:#1D6B43;--chip:#F2E6CC;

*{box-sizing:border-box;margin:0}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--sans);max-width:680px;margin:0 auto;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;background:var(--red);color:#fff;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.2)}

.brand{font:400 21px/1.1 var(--disp);margin-right:auto}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:99px;padding:3px}

.lang button.on{background:#fff;color:var(--red)}
.toran{height:30px;background:
 radial-gradient(circle at 11px 9px,var(--gold) 6px,#E07A00 7px,transparent 8px) 0 0/22px 30px repeat-x,
 linear-gradient(var(--green),var(--green)) 0 0/100% 3px no-repeat;position:relative}
.toran::after{content:"";position:absolute;left:0;right:0;top:12px;height:14px;background:conic-gradient(from 150deg at 50% 0,var(--green) 0 60deg,transparent 60deg) 0 0/22px 14px repeat-x;opacity:.85}
.hero{padding:20px 20px 8px;text-align:center}
.hero h1{font:400 clamp(27px,8vw,38px)/1.18 var(--disp);color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hero h1{color:#FF8FA3}}
.hero .sub{margin-top:8px;color:var(--muted);font-weight:600}
.hero .loc{display:inline-block;max-width:100%;line-height:1.4;border-radius:18px !important;margin-top:10px;font-weight:800;color:var(--green);border:1.5px solid var(--green);border-radius:99px;padding:4px 14px;font-size:14px}
.search{display:block;padding:14px 16px 0;position:relative}
.search input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px 0 46px;font:600 16px var(--sans);box-shadow:0 4px 14px rgba(120,70,20,.08)}

.cat{border:2px solid transparent;border-radius:14px;padding:10px 2px 8px;cursor:pointer;text-align:center;color:var(--ink);font:700 11.5px/1.2 var(--sans);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:78px;justify-content:center}

.group{padding:22px 16px 0}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gh .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:21px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;display:flex;gap:12px;position:relative;box-shadow:0 2px 8px rgba(120,70,20,.06)}

.cb{flex:1;min-width:0}
.nm{font:800 17px/1.25 var(--sans)}
.packs{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.pk{border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:700 13px var(--sans);padding:5px 11px;border-radius:99px;cursor:pointer;min-height:34px}
.pk.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:9px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .price{color:#FF8FA3}}
.add{border:2px solid var(--green);background:transparent;color:var(--green);font:800 14px var(--sans);padding:6px 20px;border-radius:10px;cursor:pointer}

:root:not([data-theme="light"]) .step{color:#0E2A1B}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-weight:600}
.miss{margin:22px 16px 0;padding:18px;border:2px dashed var(--red);border-radius:16px;text-align:center}
.miss b{display:block;font:400 19px var(--disp);margin-bottom:8px}
.miss button{border:0;background:var(--red);color:var(--redink);font:800 15px var(--sans);padding:12px 22px;border-radius:12px;cursor:pointer}
.foot{text-align:center;color:var(--muted);font-weight:700;font-size:13.5px;padding:24px 20px 0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));transform:translateY(130%);transition:transform .25s}.bar.show{transform:none}
.bar button{width:100%;max-width:656px;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--red);color:var(--redink);font:800 16px var(--sans);padding:16px 20px;border-radius:16px;cursor:pointer;box-shadow:0 8px 24px rgba(168,16,43,.4)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:680px;margin:0 auto;background:var(--bg);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .28s;visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.sheet h3{font:400 24px var(--disp);margin-bottom:8px;padding-right:44px}.sheet label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px;font-weight:700}
.close{position:absolute;top:14px;right:14px;border:0;background:var(--chip);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:600 16px var(--sans)}
.line{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.line .n{flex:1;font-weight:700;line-height:1.25}.line .n small{display:block;color:var(--muted);font-weight:600}.line .p{font-weight:800;min-width:60px;text-align:right}
.mode{display:flex;gap:8px;margin:12px 0 0}.mode button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 14px var(--sans);padding:10px 4px;border-radius:12px;cursor:pointer}.mode button.on{border-color:var(--green);background:var(--chip)}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;margin:14px 0 0}
.send{display:block;width:100%;text-align:center;text-decoration:none;border:0;background:#1FA855;color:#fff;font:800 16px var(--sans);padding:16px;border-radius:14px;cursor:pointer;margin-top:14px}
.btn2{width:100%;border:2px solid var(--ink);background:transparent;color:var(--ink);font:800 15px var(--sans);padding:13px;border-radius:12px;cursor:pointer;margin-top:10px}
.note{font-size:13.5px;color:var(--muted);text-align:center;margin-top:10px;font-weight:600}
html{-webkit-text-size-adjust:100%}button,.cat,.pk{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}.sheet{overscroll-behavior:contain;max-height:92vh;max-height:92dvh}.brand{min-width:0}
@media(max-width:380px){.lang button{padding:7px 9px;font-size:12.5px}.brand{font-size:18px}.top{padding:10px 12px}}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-12px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.hero .meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:10px}
.callbtn{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--green);color:#fff;font:800 16px var(--sans);padding:10px 22px;border-radius:99px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.18)}.callbtn svg{width:18px;height:18px;fill:currentColor}.callbtn:active{transform:scale(.97)}

  $("lines").innerHTML=L.length?L.map(([k,v])=>{const [p,i]=parse(k);return `<div class="line"><span class="n">${esc(nameOf(p))}<small>${esc(lab(p.o[i][0]))}</small></span><span class="step"><button data-a="-1" data-key="${k}">−</button><span>${v}</span><button data-a="1" data-key="${k}">+</button></span><span class="p">${inr(p.o[i][1]*v)}</span></div>`}).join(""):`<p class="note" style="text-align:left">${t("empty")}</p>`;
  $("grand").textContent=inr(total());}
function renderAll(){renderStatic();renderCats();renderList();renderBar();}
function openSheet(id){["cart","done","callSheet"].forEach(s=>$(s).classList.toggle("show",s===id));$("scrim").classList.toggle("show",!!id);document.body.classList.toggle("lock",!!id);renderBar();}
function change(k,d){cart[k]=Math.max(0,Math.min(99,(cart[k]||0)+d));if(!cart[k])delete cart[k];
  const [p]=parse(k);const el=document.querySelector(`[data-ctl="${p.id}"]`);if(el)el.innerHTML=ctl(p);SAVE();renderBar();}
document.addEventListener("click",e=>{
  const l=e.target.closest("[data-l]");if(l){LANG=l.dataset.l;document.documentElement.lang=LANG;document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));try{localStorage.setItem("st_lang",LANG)}catch(_){}renderAll();return;}
  const c=e.target.closest(".cat");if(c){cat=c.dataset.cat;renderCats();renderList();const top=$("list").getBoundingClientRect().top+scrollY-70;scrollTo({top:Math.max(0,top-8),behavior:"smooth"});return;}
  const pk=e.target.closest(".pk");if(pk){const id=+pk.dataset.p;sel[id]=+pk.dataset.i;const p=P[id],el=$("c"+id);
    el.querySelectorAll(".pk").forEach(b=>b.classList.toggle("on",+b.dataset.i===sel[id]));el.querySelector(".price").textContent=inr(p.o[sel[id]][1]);el.querySelector("[data-ctl]").innerHTML=ctl(p);return;}
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.a)return change(b.dataset.key,+b.dataset.a);
  
  if(b.hasAttribute("data-close"))openSheet(null);});
$("q").addEventListener("input",e=>{q=e.target.value.trim();renderList();});
$("openList").onclick=()=>openSheet("cart");$("missB").onclick=()=>{openSheet("cart");setTimeout(()=>$("extra").focus(),300);};$("scrim").onclick=()=>openSheet(null);
/* ===== WhatsApp: opens the app directly on phones, with a copy fallback ===== */
const waURL=x=>`https://wa.me/${WA}?text=${encodeURIComponent(x)}`;
$("waLink").addEventListener("click",()=>{track("wa");$("waHint").textContent=t("opening");setTimeout(()=>{if(document.visibilityState==="visible")$("waHint").textContent=t("notopen");},2500);});
$("copyBtn").onclick=()=>{const p=$("preview");p.select();p.setSelectionRange(0,99999);let ok=false;try{ok=document.execCommand("copy")}catch(_){}
  if(!ok&&navigator.clipboard)navigator.clipboard.writeText(p.value).catch(()=>{});$("copyBtn").textContent=t("copied");};
$("sendList").onclick=()=>{const extra=$("extra").value.trim();if(!count()&&!extra){$("extra").focus();return;}
  $("err").textContent="";if($("ph").value.trim()&&!ph()){$("err").textContent=t("need");$("ph").focus();return;}
  /* the message is always bilingual so the shop can read it easily */
  let m=`*New shopping list – ${SHOP}*\n`;
  m+=`Type: Pickup at shop\n`;
  if(ph())m+=`Phone: +91 ${ph()}\n`;
  if($("tm").value)m+=`Pickup time: ${$("tm").selectedOptions[0].text}\n`;
  if($("nmI").value.trim())m+=`Name: ${$("nmI").value.trim()}\n`;
  m+="\n";
  m+=Object.entries(cart).map(([k,v])=>{const [p,i]=parse(k);return `${v} x ${p.e} (${p.m}) – ${p.o[i][0]} – ${inr(p.o[i][1]*v)}`}).join("\n");
  if(extra)m+=`\n\nOther items:\n${extra}`;
  if($("cn").value.trim())m+=`\n\nNote: ${$("cn").value.trim()}`;
  if(count())m+=`\n\n*Estimated total: ${inr(total())}*`;
  $("waLink").href=waURL(m);$("preview").value=m;$("waHint").textContent=m.length>1400?t("long"):"";$("copyBtn").textContent=t("copy");track("order");openSheet("done");};
const SAVE=()=>{try{const o={};Object.entries(cart).forEach(([k,v])=>{const [p,i]=parse(k);o[p.e+"|"+p.o[i][0]]=v});localStorage.setItem("st_cart",JSON.stringify(o))}catch(_){}};
function LOAD(){try{const o=JSON.parse(localStorage.getItem("st_cart")||"{}");Object.entries(o).forEach(([k,v])=>{const j=k.lastIndexOf("|"),p=P.find(x=>x.e===k.slice(0,j));if(!p)return;const i=p.o.findIndex(x=>x[0]===k.slice(j+1));if(i>-1&&+v>0)cart[keyOf(p.id,i)]=Math.min(99,+v)})}catch(_){}}
try{const sv=localStorage.getItem("st_lang");if(sv==="mr"||sv==="hi"){LANG=sv;document.documentElement.lang=sv;document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===sv));}}catch(_){}
document.addEventListener("keydown",e=>{if(e.key==="Escape")openSheet(null)});
document.addEventListener("focusin",e=>{if(e.target.matches(".sheet input,.sheet textarea"))setTimeout(()=>e.target.scrollIntoView({block:"center",behavior:"smooth"}),350)});
const ph=()=>{let d=$("ph").value.replace(/\D/g,"");if(d.length===12&&d.startsWith("91"))d=d.slice(2);if(d.length===11&&d[0]==="0")d=d.slice(1);return /^[6-9]\d{9}$/.test(d)?d:""};
function toast(m){const e=$("toast");e.textContent=m;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),4500)}
$("callBtn").addEventListener("click",e=>{e.preventDefault();track("call");$("callCp").dataset.d="";$("callCp").textContent=t("cp");openSheet("callSheet");});
$("callNow").addEventListener("click",()=>{track("call");/* plain tel: link runs natively; on Android, if the dialer did not open, try the dial intent */
  if(/Android/i.test(navigator.userAgent))setTimeout(()=>{if(document.visibilityState==="visible")location.href="intent:+918446010969#Intent;scheme=tel;action=android.intent.action.DIAL;end"},900);});
$("callCp").onclick=()=>{let ok=false;try{const x=document.createElement("textarea");x.value=CALLNO;x.style.cssText="position:fixed;opacity:0";document.body.appendChild(x);x.select();x.setSelectionRange(0,99);ok=document.execCommand("copy");x.remove()}catch(_){}
  if(!ok&&navigator.clipboard)navigator.clipboard.writeText(CALLNO).catch(()=>{});$("callCp").dataset.d="1";$("callCp").textContent=t("cpd");};
$("clrBtn").onclick=()=>{Object.keys(cart).forEach(k=>delete cart[k]);$("extra").value="";$("cn").value="";SAVE();openSheet(null);renderAll();};
const CK=["nmI","ph"];
(()=>{const s=$("tm");s.add(new Option("",""));for(let m=480;m<=1230;m+=30){const h=Math.floor(m/60),mi=m%60,h12=h>12?h-12:h;s.add(new Option(`${h12}:${String(mi).padStart(2,"0")} ${h<12?"AM":"PM"}`,String(m)))}})();
try{const c=JSON.parse(localStorage.getItem("st_cust")||"{}");CK.forEach(i=>{if(c[i])$(i).value=String(c[i]).slice(0,200)})}catch(_){}
CK.forEach(i=>$(i).addEventListener("input",()=>{$("err").textContent="";try{const c={};CK.forEach(j=>c[j]=$(j).value);localStorage.setItem("st_cust",JSON.stringify(c))}catch(_){}}));
/* ===== Free visit counter (Google Sheet). Paste your Apps Script web-app URL below; empty = off. ===== */
const TRK="https://script.google.com/macros/s/AKfycbzIK6vUri08qv73I8VP3guxasfKl5AUIp5fwHV2KaXtqM0954H2X-9pjAtVMLwoafw/exec";
function track(ev){try{if(!TRK)return;if(ev==="open"){if(sessionStorage.getItem("st_s"))return;sessionStorage.setItem("st_s","1");}
let v="";try{v=localStorage.getItem("st_vid");if(!v){v=Math.random().toString(36).slice(2,10);localStorage.setItem("st_vid",v)}}catch(_){}
const src=new URLSearchParams(location.search).get("src")||"direct";
new Image().src=TRK+"?e="+ev+"&s="+encodeURIComponent(src)+"&l="+LANG+"&v="+v+"&w="+innerWidth+"&t="+Date.now();}catch(_){}}
/* ===== Live catalogue from Google Sheet (price + stock). Paste the published CSV link; empty = use built-in list. ===== */
const SHEET_CSV="";
function csvParse(t){t=t.replace(/^\uFEFF/,"");const R=[];let r=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===","){r.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.some(x=>x.trim()))R.push(r);r=[]}else c+=ch}
  r.push(c);if(r.some(x=>x.trim()))R.push(r);return R}
function applyCSV(text,initial){try{const rows=csvParse(text).slice(1),out=[];
  rows.forEach(x=>{const cat=(x[0]||"").trim().toLowerCase(),e=(x[1]||"").trim();if(!CAT[cat]||!e)return;
    if(/^(no|n|0|out|false|over|नाही|नहीं)$/i.test((x[11]||"").trim()))return;
    const o=[];for(let k=5;k<=9;k+=2){const pk=(x[k]||"").trim(),pr=parseFloat(String(x[k+1]||"").replace(/[₹,\s]/g,""));if(pk&&pr>0)o.push([pk,pr])}
    if(!o.length)return;out.push({id:out.length,c:cat,e,m:(x[2]||"").trim()||e,h:(x[3]||"").trim()||(x[2]||"").trim()||e,ic:(x[4]||"").trim()||"🛒",o})});
  if(out.length<10)return false;
  if(!initial)SAVE();
  P.length=0;P.push(...out);Object.keys(sel).forEach(k=>delete sel[k]);Object.keys(cart).forEach(k=>delete cart[k]);
  if(!initial){LOAD();renderAll();}return true}catch(_){return false}}
async function syncSheet(){if(!SHEET_CSV)return;try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),8000);
  const r=await fetch(SHEET_CSV+(SHEET_CSV.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store",signal:ac.signal});clearTimeout(tm);if(!r.ok)return;
  const txt=await r.text();if(txt.length<50||/^\s*</.test(txt))return;
  let old=null;try{old=localStorage.getItem("st_data")}catch(_){}
  if(txt!==old&&applyCSV(txt,false)){try{localStorage.setItem("st_data",txt)}catch(_){}}}catch(_){}}
try{const cc=localStorage.getItem("st_data");if(cc&&SHEET_CSV)applyCSV(cc,true)}catch(_){}
LOAD();renderAll();track("open");syncSheet();
</script>
